# The Xcode project is generated from this file: scripts/generate.sh (which
# reads the version from app/pocketvibe/config.json, as Android does).
name: PocketVibe
options:
  bundleIdPrefix: dev.cobanov
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: ${POCKETVIBE_VERSION}
    CURRENT_PROJECT_VERSION: ${POCKETVIBE_BUILD}
    DEVELOPMENT_TEAM: 6U58AKY6F8
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  PocketVibe:
    type: application
    platform: iOS
    sources:
      - path: PocketVibe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.pocketvibe
        PRODUCT_NAME: PocketVibe
        INFOPLIST_FILE: PocketVibe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "PocketVibe App Store"
    scheme:
      testTargets: [PocketVibeUITests]
    postCompileScripts:
      - name: Web files
        script: sh "$SRCROOT/scripts/copy-web.sh"
        basedOnDependencyAnalysis: false
  PocketVibeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PocketVibe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.pocketvibe.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
