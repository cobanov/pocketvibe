<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=720, height=480" />
    <title>PocketVibe</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <header>
      <div class="brand">PocketVibe</div>
      <nav>
        <span class="hint">L</span>
        <span class="tab" data-tab="library">Library</span>

      <div id="status"></div>

    <main id="content"></main>
    <footer id="hints"></footer>
    <div id="dialog" hidden></div>
    <div id="toast" hidden></div>
    <script src="launcher.js"></script>
  </body>
</html>
