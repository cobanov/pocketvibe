<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PocketVibe</title>
    <link rel="stylesheet" href="play.css" />
  </head>
  <body>
    <div id="game"><iframe id="frame" allow="gamepad; autoplay"></iframe></div>
    <aside id="side" hidden><div class="side-inner"></div></aside>
    <div id="splash">
      <div class="splash-inner">
        <div class="splash-cover"></div>
        <div class="splash-title"></div>
        <div class="splash-meta"></div>
        <div class="splash-bar"><span></span></div>
        <div class="leave splash-leave"></div>
      </div>
    </div>
    <script type="module" src="play.js"></script>
  </body>
</html>
