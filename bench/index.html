<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handheld bench</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        color: #eee;
        font: 16px/1.4 system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: 720px;
        height: 480px;
      }
      #stage canvas {
        display: block;
      }
      #status {
        position: absolute;
        top: 6px;
        left: 8px;
        z-index: 1;
        padding: 2px 6px;
        background: rgba(0, 0, 0, 0.6);
        font: 13px ui-monospace, monospace;
      }
      #menu a {
        display: block;
        padding: 6px 12px;
        color: #8cf;
      }
      table {
        margin: 12px;
        border-collapse: collapse;
        font: 13px ui-monospace, monospace;
      }
      th,
      td {
        padding: 4px 8px;
        border: 1px solid #444;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="stage"></div>
    <div id="menu"></div>
    <div id="results"></div>
    <script type="module" src="./src/bench.js"></script>
  </body>
</html>
